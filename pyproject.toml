[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppi-finite"
version = "0.1.0"
description = "Finite-sample-valid prediction-powered inference: leverage-corrected confidence intervals"
requires-python = ">=3.11"          # tomllib is stdlib only from 3.11 (15 §13 CONFLICT 1)
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: expensive statistical tests, excluded from the fast suite"]
addopts = "-q -m 'not slow'"
